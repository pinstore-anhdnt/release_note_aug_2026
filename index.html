<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đã ghi nhận — Inside GPP</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#E4F4EC;}
  body{min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:40px 20px;
       font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
  .card{width:100%;max-width:480px;background:#fff;border:1px solid #C8E4D6;border-radius:22px;
        padding:44px 38px 34px;text-align:center;box-shadow:0 18px 40px -28px rgba(20,81,60,.45);}
  .mark{width:78px;height:78px;margin:0 auto;border-radius:50%;background:#E4F4EC;display:flex;
        align-items:center;justify-content:center;font-size:38px;line-height:1;}
  h1{font-size:21px;font-weight:800;color:#14513C;margin:20px 0 0;letter-spacing:-.01em;text-wrap:pretty;}
  p{font-size:13.5px;line-height:1.75;color:#5F8874;margin:11px 0 0;text-wrap:pretty;}
  .btn{display:inline-block;margin-top:26px;background:#1F7A57;color:#fff;font-size:13.5px;font-weight:800;
       text-decoration:none;padding:14px 28px;border-radius:13px;}
  .btn:hover{background:#14513C;}
  .foot{border-top:1px solid #C8E4D6;margin-top:30px;padding-top:16px;font-size:11.5px;line-height:1.7;color:#7FA894;text-wrap:pretty;}
  .foot a{color:#1F7A57;font-weight:700;text-decoration:none;}
  .foot a:hover{color:#14513C;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" id="mark"></div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <a class="btn" href="https://nexus.vnggames.com/aawp/nexus-docs/space/553844786?page_id=1929543792">Về trang Release Notes</a>
    <div class="foot">Muốn nói rõ hơn? Gửi em ở <a href="mailto:gpp.communication@vng.com.vn">gpp.communication@vng.com.vn</a></div>
  </div>
  <script>
    const fb = new URLSearchParams(location.search).get('fb') || '';
    const map = {
      // Vietnamese
      'rat-hay':      { mark: '🥰', title: 'Đã ghi nhận, cảm ơn anh/chị!',                   body: 'Phản hồi của anh/chị giúp em chọn nội dung sát hơn cho bản tin số sau.' },
      'tam-on':       { mark: '🙂', title: 'Cảm ơn anh/chị đã phản hồi!',              body: 'Em ghi nhận Ạ. Nội dung vẫn có thể tốt hơn — anh/chị có thể gửi góp ý cụ thể qua email bên dưửi nhé!' },
      'chua-trung':   { mark: '🙏', title: 'Cảm ơn anh/chị đã thẳng thắn chia sẻ!', body: 'Góp ý của anh/chị rất quý giá với em. Em sẽ điều chỉnh nội dung để phù hợp hơn trong các bản tin sắp tới!' },
      // English
      'great':        { mark: '🥰', title: 'Thanks for the love!',               body: 'Your feedback helps us pick more relevant content for the next edition.' },
      'okay':         { mark: '🙂', title: 'Thanks for your feedback!',           body: 'Noted! We can always do better — feel free to share specific thoughts via email below.' },
      'not-relevant': { mark: '🙏', title: 'Thanks for being honest!',            body: 'Your candid feedback is really valuable. We’ll adjust the content to make it more useful in upcoming editions.' },
    };
    const d = map[fb] || map['rat-hay'];
    document.getElementById('mark').textContent  = d.mark;
    document.getElementById('title').textContent = d.title;
    document.getElementById('body').textContent  = d.body;
  </script>
</body>
</html>
